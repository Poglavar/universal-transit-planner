<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <style>
      .text-zagreb {
        font-family: 'Montserrat', 'Inter', 'Segoe UI', sans-serif;
        font-weight: 900;
        font-size: 110px;
        fill: #1E293B;
        letter-spacing: -3px;
      }
      .text-lol {
        font-family: 'Montserrat', 'Inter', 'Segoe UI', sans-serif;
        font-weight: 900;
        font-size: 110px;
        fill: #0EA5E9;
        letter-spacing: -3px;
      }
      .ray { fill: #FFA100; }
    </style>
  </defs>

  <rect width="1000" height="1000" fill="#F8FAFC" />

  <g transform="translate(500, 420)">

    <!-- Sun Rays -->
    <g>
      <path d="M-25, -230 L0, -320 L25, -230 Z" class="ray" />
      <path d="M-25, -230 L0, -320 L25, -230 Z" class="ray" transform="rotate(30)" />
      <path d="M-25, -230 L0, -320 L25, -230 Z" class="ray" transform="rotate(60)" />
      <path d="M-25, -230 L0, -320 L25, -230 Z" class="ray" transform="rotate(90)" />
      <path d="M-25, -230 L0, -320 L25, -230 Z" class="ray" transform="rotate(120)" />
      <path d="M-25, -230 L0, -320 L25, -230 Z" class="ray" transform="rotate(150)" />
      <path d="M-25, -230 L0, -320 L25, -230 Z" class="ray" transform="rotate(180)" />
      <path d="M-25, -230 L0, -320 L25, -230 Z" class="ray" transform="rotate(210)" />
      <path d="M-25, -230 L0, -320 L25, -230 Z" class="ray" transform="rotate(240)" />
      <path d="M-25, -230 L0, -320 L25, -230 Z" class="ray" transform="rotate(270)" />
      <path d="M-25, -230 L0, -320 L25, -230 Z" class="ray" transform="rotate(300)" />
      <path d="M-25, -230 L0, -320 L25, -230 Z" class="ray" transform="rotate(330)" />
    </g>

    <!-- Spires of Zagreb Cathedral -->
    <path d="M-50,-180 L-35,-360 L-20,-180 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="4"/>
    <path d="M20,-180 L35,-360 L50,-180 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="4"/>

    <!-- Sun Body -->
    <circle cx="0" cy="0" r="200" fill="url(#sunGrad)" stroke="#FFFFFF" stroke-width="12"/>

    <!-- St Mark's Church Roof overlapping Sun -->
    <!-- The roof is a trapezoid with checkerboard pattern -->
    <g transform="translate(-100, -200)">
      <path d="M 20,0 L 180,0 L 210,90 L -10,90 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>

      <!-- Coat of arms representation left (Croatian) -->
      <g transform="translate(45, 25)">
        <rect width="40" height="45" fill="#FFFFFF" rx="4"/>
        <rect x="0" y="5" width="10" height="10" fill="#EF4444" />
        <rect x="20" y="5" width="10" height="10" fill="#EF4444" />
        <rect x="10" y="15" width="10" height="10" fill="#EF4444" />
        <rect x="30" y="15" width="10" height="10" fill="#EF4444" />
        <rect x="0" y="25" width="10" height="10" fill="#EF4444" />
        <rect x="20" y="25" width="10" height="10" fill="#EF4444" />
        <rect x="10" y="35" width="10" height="10" fill="#EF4444" />
        <rect x="30" y="35" width="10" height="10" fill="#EF4444" />
      </g>

      <!-- Coat of arms representation right (Zagreb) -->
      <g transform="translate(115, 25)">
        <rect width="40" height="45" fill="#3B82F6" rx="4"/>
        <path d="M 10,35 L 20,15 L 30,35 Z" fill="#FFFFFF" />
        <rect x="15" y="35" width="10" height="10" fill="#FFFFFF" />
        <circle cx="10" cy="15" r="3" fill="#FBBF24"/>
        <circle cx="30" cy="15" r="3" fill="#FBBF24"/>
      </g>
    </g>

    <!-- Face -->
    <!-- Eyes -->
    <path d="M -60 -20 Q -40 -50 -20 -20" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round"/>
    <path d="M 20 -20 Q 40 -50 60 -20" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round"/>
    <!-- Blushes -->
    <circle cx="-90" cy="30" r="20" fill="#EA580C" opacity="0.6"/>
    <circle cx="90" cy="30" r="20" fill="#EA580C" opacity="0.6"/>
    <!-- Big joyful smile -->
    <path d="M -50 40 Q 0 110 50 40" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round"/>

    <!-- Bar Chart -->
    <rect x="-140" y="100" width="60" height="140" rx="15" fill="url(#bar1)" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="-60" y="60" width="60" height="180" rx="15" fill="url(#bar4)" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="20" y="20" width="60" height="220" rx="15" fill="url(#bar2)" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="100" y="-30" width="60" height="270" rx="15" fill="url(#bar3)" stroke="#FFFFFF" stroke-width="8"/>

    <!-- Line Chart crossing over -->
    <path d="M -240 180 L -110 90 L -30 140 L 50 -10 L 200 -130" fill="none" stroke="#0EA5E9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow on Line Chart -->
    <path d="M 200 -130 L 150 -150 L 170 -80 Z" fill="#0EA5E9" stroke="#0EA5E9" stroke-width="4" stroke-linejoin="round"/>

    <!-- Nodes -->
    <circle cx="-240" cy="180" r="16" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="8"/>
    <circle cx="-110" cy="90" r="16" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="8"/>
    <circle cx="-30" cy="140" r="16" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="8"/>
    <circle cx="50" cy="-10" r="16" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="8"/>

  </g>

  <!-- Title Text -->
  <g transform="translate(500, 850)" text-anchor="middle">
    <text>
      <tspan class="text-zagreb">zagreb.</tspan><tspan class="text-lol">lol</tspan>
    </text>
  </g>

</svg>
